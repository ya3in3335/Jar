name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a release asset
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub-hosted ubuntu image already ships the Android SDK, so no
      # setup action is needed — one less thing to break.
      - name: Report the Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::no Android SDK on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" | tee -a "$GITHUB_ENV"
          echo "SDK platforms: $(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools:   $(ls "$sdk/build-tools" 2>/dev/null | tr '\n' ' ')"

      # No gradlew is committed, so Gradle is pinned here. Run
      # `gradle wrapper` locally once if you want ./gradlew on your machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Gradle output is captured and, on failure, re-emitted as GitHub
      # annotations. Raw run logs live in blob storage that the development
      # sandbox cannot reach; annotations come back over the API.
      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee /tmp/test.log || {
            echo "--- surfacing failures as annotations ---"
            grep -E "^e: |error: |Unresolved reference|Compilation error|Caused by:|FAILED" /tmp/test.log \
              | grep -v "^> Task" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/build.log || {
            echo "--- surfacing failures as annotations ---"
            grep -E "^e: |error: |Unresolved reference|Compilation error|Caused by:|FAILED" /tmp/build.log \
              | grep -v "^> Task" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      # Does not block the APK, but surfaces findings as annotations so they
      # are visible without reading the raw run log.
      - name: Lint
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:lintDebug --no-daemon --console=plain 2>&1 | tee /tmp/lint.log || {
            # Match lint's own report lines, not Gradle's task chatter.
            grep -E ": (Error|Warning): |[0-9]+ errors?, [0-9]+ warnings?" /tmp/lint.log \
              | head -30 | while IFS= read -r line; do echo "::warning::$line"; done
            exit 1
          }

      # Fail loudly rather than publishing an empty artifact.
      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          size=$(stat -c%s "$apk")
          echo "::notice::APK $apk is $((size / 1024 / 1024)) MB"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::APK is implausibly small ($size bytes)"
            exit 1
          fi
          cp "$apk" JARVIS-debug.apk
          sha256sum JARVIS-debug.apk | tee JARVIS-debug.apk.sha256
          echo "::notice::sha256 $(cut -d' ' -f1 < JARVIS-debug.apk.sha256)"

      # Actions artifacts need a GitHub login and arrive zipped, which is
      # awkward on a phone. A release asset is a plain link you can open in
      # the phone browser and install directly.
      - name: Publish the APK as a rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 < JARVIS-debug.apk.sha256)
          size=$(( $(stat -c%s JARVIS-debug.apk) / 1024 / 1024 ))
          gh release delete android-debug --yes --cleanup-tag 2>/dev/null || true
          gh release create android-debug \
            JARVIS-debug.apk JARVIS-debug.apk.sha256 \
            --title "JARVIS Android (debug)" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --notes "نسخة تجريبية (debug) مبنية آليًا من \`${GITHUB_SHA:0:7}\`.

          الحجم: ${size} ميغابايت
          SHA-256: \`${sha}\`

          للتثبيت: نزّل \`JARVIS-debug.apk\` ثم اسمح بتثبيت التطبيقات من هذا المصدر.

          هذه النسخة أساس فقط: الصوت والتعرّف على الكلام ومنظومة الوكيل غير منفّذة بعد — انظر \`docs/BUILD_STATUS.md\`."
          echo "::notice::https://github.com/${GITHUB_REPOSITORY}/releases/download/android-debug/JARVIS-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: |
            android/JARVIS-debug.apk
            android/JARVIS-debug.apk.sha256
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
