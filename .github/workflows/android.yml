name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No gradlew is committed, so Gradle is pinned here instead. Run
      # `gradle wrapper` locally once if you want ./gradlew on your machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Fail loudly rather than publishing an empty artifact.
      - name: Verify the APK exists
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          size=$(stat -c%s "$apk")
          echo "APK: $apk ($((size / 1024 / 1024)) MB)"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::APK is implausibly small ($size bytes)"
            exit 1
          fi
          cp "$apk" JARVIS-debug.apk
          sha256sum JARVIS-debug.apk | tee JARVIS-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: |
            android/JARVIS-debug.apk
            android/JARVIS-debug.apk.sha256
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
