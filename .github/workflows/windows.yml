name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Logic tests run on Linux too and are much faster there; the packaging
    # job below is what actually needs Windows.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt needs these even under the offscreen platform plugin; without
      # them importing PySide6 fails outright on a bare Linux runner.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1 libportaudio2 libsndfile1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check Qt actually imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import PySide6; from PySide6.QtWidgets import QApplication; \
            app = QApplication([]); print('PySide6', PySide6.__version__, 'ok')"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee /tmp/pytest.log || {
            grep -E "^FAILED|^E  |Error|assert" /tmp/pytest.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

  package:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests on Windows
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee /tmp/pytest.log || {
            grep -E "^FAILED|^E  |Error|assert" /tmp/pytest.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build executable
        run: |
          set -o pipefail
          pyinstaller --noconfirm jarvis.spec 2>&1 | tee /tmp/pyinstaller.log || {
            grep -iE "error|exception|failed" /tmp/pyinstaller.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Verify the executable
        run: |
          set -euo pipefail
          if [ ! -f "dist/JARVIS/JARVIS.exe" ]; then
            echo "::error::JARVIS.exe was not produced"
            exit 1
          fi
          echo "::notice::JARVIS.exe is $(stat -c%s dist/JARVIS/JARVIS.exe) bytes"

      - name: Package
        run: |
          set -euo pipefail
          cd dist && 7z a -tzip ../JARVIS-Windows.zip JARVIS && cd ..
          sha256sum JARVIS-Windows.zip | tee JARVIS-Windows.zip.sha256
          echo "::notice::sha256 $(cut -d' ' -f1 < JARVIS-Windows.zip.sha256)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            windows/JARVIS-Windows.zip
            windows/JARVIS-Windows.zip.sha256
          if-no-files-found: error
